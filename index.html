  const land=W>H*1.2,hh=land?H*.2:H*.15,cw=Math.min(W-16*U,520*U),top=Math.max(SA.t+hh,H*.14)+6*U,bot=H-SA.b-66*U,ch=Math.min(100*U,(bot-top)/3-8*U),x=cxm-cw/2;
  for(let i=0;i<3;i++){
    const y=top+i*(ch+8*U),m=slotMeta[i];
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(x,y+3*DPR,cw,ch);
    box(x,y,cw,ch,m?'#26304a':'#1e1e30','#0a0a14');
    const ps=ch-16*U,px=x+8*U,py=y+8*U;
    box(px,py,ps,ps,m?'#3a6aa8':'#2a2a40','#0a0a14');
    if(m)ics('hat',px+ps*.2,py+ps*.2+Math.sin(gt*3+i)*2*U,ps*.6,'#ffcf2e');else ics('plus',px+ps*.3,py+ps*.3,ps*.4,'#5a5a7a');
    ctx.fillStyle='#ffd54a';ctx.fillRect(px,py,Math.round(16*U),Math.round(16*U));txt(String(i+1),px+8*U,py+8*U,11*U,'#1a1020','center',true);
    const tx=px+ps+12*U,bwid=Math.min(110*U,cw*.3),bx=x+cw-bwid-10*U;
    if(m){
      const pm=Math.floor(m.pt/60),r1=y+ch*.3,r2=y+ch*.55,r3=y+ch*.8,sz=11*U;
      txt('이어하기 가능',tx,r1,11*U,'#9af0a0','left',true);
      let cx2=tx;
      cx2+=chip('sun',m.d+'일',cx2,r2,'#e8e8f4',sz)+10*U;
      cx2+=chip('heart',String(m.mx),cx2,r2,'#ff8a8a',sz)+10*U;
      chip('depth',m.dp+'m',cx2,r2,'#9ad0ff',sz);
      cx2=tx;
      cx2+=chip('coin',String(m.co),cx2,r3,'#ffd54a',sz)+10*U;
      cx2+=chip('clock',Math.floor(pm/60)+'h '+(pm%60)+'m',cx2,r3,'#cfd8ee',sz)+10*U;
      if(m.bo)chip('skull','처치',cx2,r3,'#ff6a8a',sz);
      const bh=(ch-24*U)/2;
      ibtn(bx,y+8*U,bwid,bh,'#3fa352','play','이어하기',12*U,'slotgo',i);
      const armed=delArm===i;
      ibtn(bx,y+16*U+bh,bwid,bh,armed?'#c03a3a':'#5a3a3a','trash',armed?'확인':'',11*U,'slotdel',i);
    }else{
      txt('빈 슬롯',tx,y+ch*.38,13*U,'#8a94ac','left',true);
      txt('새 퇴사를 시작하세요',tx,y+ch*.66,10*U,'#6a7490','left',false);
      const bh=ch-20*U;
      ibtn(bx,y+10*U,bwid,bh,'#2e6aa8','plus','새 모험',13*U,'slotgo',i);
    }
  }
  const bw=Math.min(180*U,W*.5),bh=Math.round(42*U);
  ibtn(cxm-bw/2,H-SA.b-bh-14*U,bw,bh,'#4a4a68','back','뒤로',14*U,'back',0);
}
function drawDead(){
  ctx.fillStyle='rgba(60,0,10,.62)';ctx.fillRect(0,0,W,H);
  const is=Math.min(W/9,44*U),land=W>H*1.3;
  const bob=Math.sin(P.deadT*3)*3*U;
  ics('skull',W/2-is/2,(land?H*.08:H*.14)+bob,is,'#ff6a6a');
  const ep=P.epi||'쓰러졌다',lines=wrapLines(ep,Math.min(W*.86,520*U),16*U),ly=(land?H*.08:H*.14)+is+18*U;
  for(let k=0;k<lines.length;k++)txt(lines[k],W/2,ly+k*21*U,16*U,'#ffd0d0','center',true);
  txt(P.tn||'',W/2,ly+lines.length*21*U+4*U,12*U,'#ff9a9a','center',true);
  const cy2=ly+lines.length*21*U+32*U,dp=Math.max(0,Math.round(P.y-SURF)),sz=12*U;
  let c1=chip('depth',dp+'m',0,-999,'#9ad0ff',sz),c2=chip('skull',String(kills),0,-999,'#ff8a8a',sz),c3=chip('coin',String(coins),0,-999,'#ffd54a',sz);
  let cx3=W/2-(c1+c2+c3+28*U)/2;
  chip('depth',dp+'m',cx3,cy2,'#9ad0ff',sz);cx3+=c1+14*U;
  chip('skull',String(kills),cx3,cy2,'#ff8a8a',sz);cx3+=c2+14*U;
  chip('coin',String(coins),cx3,cy2,'#ffd54a',sz);
  if(P.deadT>1.2){
    const bh=Math.round(46*U);
    if(land){
      const bw=Math.min(W*.3,210*U),gp=10*U,x=W/2-(bw*3+gp*2)/2,y=Math.min(cy2+26*U,H-bh-12*U-SA.b);
      ibtn(x,y,bw,bh,'#3a8a4a','heart','부활 -25%',14*U,'resp',0);
      ibtn(x+bw+gp,y,bw,bh,'#8a5a2a','talk','친구에게 자랑',14*U,'share',0);
      ibtn(x+(bw+gp)*2,y,bw,bh,'#44445a','back','타이틀',14*U,'title',0);
    }else{
      const bw=Math.min(W*.8,280*U),x=W/2-bw/2;let y=cy2+30*U;
      ibtn(x,y,bw,bh,'#3a8a4a','heart','부활  -25%',15*U,'resp',0);y+=bh+10*U;
      ibtn(x,y,bw,bh,'#8a5a2a','talk','친구에게 자랑',15*U,'share',0);y+=bh+10*U;
      ibtn(x,y,bw,bh,'#44445a','back','타이틀',15*U,'title',0);
    }
  }
}
function shareDeath(){
  const t=(P.epi||'쓰러졌다')+' — 퇴사광부 / 지하 '+Math.max(0,Math.round(P.y-SURF))+'m';
  try{
    if(navigator.share)navigator.share({title:'퇴사광부',text:t,url:location.href}).catch(()=>{});
    else if(navigator.clipboard)navigator.clipboard.writeText(t+' '+location.href).then(()=>toast('복사했다','check')).catch(()=>{});
  }catch(_){}
}
function respawn(){
  coins=Math.floor(coins*.75);mons.length=0;projs.length=0;resetPlayer(P.rs||spawn);snapCam();toast('다시 일어섰다','heart');
}
function musicMode(){
  if(state==='title')return'title';
  if(mons.some(m=>m.type==='boss'&&!m.dead))return'boss';
  const px=clamp(Math.floor(P.x),0,WW-1);
  if(P.y>colTop[px]+9)return'cave';
  if(isNight())return'night';
  const b=biomeAt(px);
  return b===1?'snow':b===2?'desert':'day';
}
function bagTap(i){
  const s=bag[i];if(!s)return;
  const k=IT[s.id].k;
  if(k==='a'||k==='r'){equip(i);return}
  if(i<8){sel=i;sfx('tick')}else{const t=bag[sel];bag[sel]=s;bag[i]=t;sfx('tick')}
}
function doResize(){resize();fs=0;ff=null;if(state==='play')clampCam()}
function closeSet(){setOpen=false;saveCfg()}
function act(r,id){
  const a=r.a;
  if(a==='start'){tsub='slots';delArm=-1;sfx('tick');if(CFG.afs&&touchMode&&!isFull())wantFull=true}
  else if(a==='full')wantFull=true
  else if(a==='share')wantShare=true
  else if(a==='quest'){invOpen=true;invTab=1;craftScroll=0;useDown=false;sfx('tick')}
  else if(a==='tutx')tutEnd=0
  else if(a==='back'){tsub='main';delArm=-1}
  else if(a==='slotgo'){delArm=-1;if(slotMeta[r.i]){if(!load(r.i))newGame(r.i)}else newGame(r.i)}
  else if(a==='slotdel'){if(delArm===r.i){delSlot(r.i);delArm=-1;sfx('tick')}else{delArm=r.i;sfx('no')}}
  else if(a==='set'){setOpen=true;setScroll=0;useDown=false;sfx('tick')}
  else if(a==='setclose')closeSet();
  else if(a==='cfgl')cfgChange(r.i,-1);
  else if(a==='cfgr')cfgChange(r.i,1);
  else if(a==='cfgt')cfgToggle(r.i);
  else if(a==='cfgs'){ptrs[id]={role:'slider',i:r.i,x0:r.x+6*U,w:r.w-12*U};cfgSlider(r.i,mouseX,r.x+6*U,r.w-12*U)}
  else if(a==='cfgb'){
    const b=SETS[r.i].a;
    if(b==='save'){save();toast('저장했다','save');closeSet()}
    else if(b==='title'){closeSet();toTitle()}
    else if(b==='full')wantFull=true;
  }
  else if(a==='slist'){ptrs[id]={role:'list',which:'set',y0:mouseY,s0:setScroll,moved:false,x0:mouseX}}
  else if(a==='sort')sortBag();
  else if(a==='slot'){sel=r.i;sfx('tick')}
  else if(a==='inv'){invOpen=!invOpen;invTab=0;craftScroll=0;useDown=false;sfx('tick')}
  else if(a==='bag')bagTap(r.i);
  else if(a==='eq')unequip(r.i);
  else if(a==='title')toTitle();
  else if(a==='resp')respawn();
  else if(a==='int')interact();
  else if(a==='heal')quickHeal();
  else if(a.slice(0,3)==='tab'){invTab=+a[3];craftScroll=0;sfx('tick')}
  else if(a==='jump'){jumpBtn=true;jbuf=.13;ptrs[id]={role:'btn',act:'jump'}}
  else if(a==='atk'){atkBtn=true;ptrs[id]={role:'btn',act:'atk'}}
  else if(a==='list'){ptrs[id]={role:'list',which:'inv',y0:mouseY,s0:craftScroll,moved:false,x0:mouseX}}
}
function listTap(x,y){
  if(!listG)return;
  const k=Math.floor((y-listG.y+craftScroll)/listG.rh);
  if(k<0||k>=listG.n)return;
  if(invTab===0)craft(cview[k]);
  else if(invTab===2)buy(k);
}
function onDown(e){
  e.preventDefault();auInit();
  const mouse=e.pointerType==='mouse';
  if(mouse){hasMouse=true;touchMode=false}else{touchMode=true}
  const x=e.clientX*DPR,y=e.clientY*DPR;mouseX=x;mouseY=y;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const r=hit(x,y);
  if(setOpen){
    if(r){if(r.a!=='panel')act(r,e.pointerId)}else closeSet();
    return;
  }
  if(state==='title'){if(r)act(r,e.pointerId);return}
  if(P.dead){if(r)act(r,e.pointerId);return}
  if(invOpen){
    if(r){if(r.a==='panel')return;act(r,e.pointerId)}else{invOpen=false}
    return;
  }
  if(r){act(r,e.pointerId);return}
  const jbx=hl_(126*U),jby=H-SA.b-84*U;
  if(!mouse&&CFG.touch!==2&&showTouch()&&joyId<0&&Math.hypot(x-jbx,y-jby)<105*U){
    joyId=e.pointerId;joyBX=jbx;joyBY=jby;ptrs[e.pointerId]={role:'joy'};
    const R=50*U;jx=clamp((x-jbx)/R,-1,1);jy=clamp((y-jby)/R,-1,1);return;
  }
  if(mouse){
    ptrs[e.pointerId]={role:'mouse'};
    if(e.button===2)rightDown=true;else{useDown=true;useX=x;useY=y}
  }else{
    ptrs[e.pointerId]={role:'use'};useDown=true;useX=x;useY=y;
  }
}
function onMove(e){
  const x=e.clientX*DPR,y=e.clientY*DPR;
  if(e.pointerType==='mouse'){hasMouse=true;mouseX=x;mouseY=y;if(useDown){useX=x;useY=y}}
  const p=ptrs[e.pointerId];if(!p)return;
  if(p.role==='joy'){
    const R=50*U;let dx=x-joyBX,dy=y-joyBY;const l=Math.hypot(dx,dy);
    jx=clamp(dx/R,-1,1);jy=clamp(dy/R,-1,1);
  }else if(p.role==='use'){useX=x;useY=y}
  else if(p.role==='slider'){cfgSlider(p.i,x,p.x0,p.w)}
  else if(p.role==='list'){
    if(Math.abs(y-p.y0)>8*DPR)p.moved=true;
    if(p.moved){if(p.which==='set')setScroll=p.s0-(y-p.y0);else craftScroll=p.s0-(y-p.y0)}
  }
}
function onUp(e){
  if(wantFull){wantFull=false;toggleFull()}
  if(wantShare){wantShare=false;shareDeath()}
  const p=ptrs[e.pointerId];
  if(e.pointerType==='mouse'&&e.buttons===0){useDown=false;rightDown=false}
  if(!p)return;
  delete ptrs[e.pointerId];
  if(p.role==='joy'){joyId=-1;jx=0;jy=0}
  else if(p.role==='use')useDown=false;
  else if(p.role==='btn'){if(p.act==='jump')jumpBtn=false;else atkBtn=false}
  else if(p.role==='slider'){saveCfg();const k=SETS[p.i].k;if(k==='ui')doResize()}
  else if(p.role==='list'&&!p.moved&&p.which==='inv')listTap(p.x0,p.y0);
}
cv.addEventListener('pointerdown',onDown);
cv.addEventListener('pointermove',onMove);
cv.addEventListener('pointerup',onUp);
cv.addEventListener('pointercancel',onUp);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  if(setOpen)setScroll+=e.deltaY*.6;
  else if(invOpen)craftScroll+=e.deltaY*.6;
  else if(state==='play')sel=(sel+(e.deltaY>0?1:7))%8;
},{passive:false});
const keyOf=e=>e.code&&e.code.length===4&&e.code.slice(0,3)==='Key'?e.code[3].toLowerCase():e.key.toLowerCase();
window.addEventListener('keydown',e=>{
  const k=keyOf(e);
  if([' ','arrowup','arrowdown','arrowleft','arrowright','tab'].includes(k))e.preventDefault();
  if(e.repeat)return;
  keys[k]=true;if(k==='w'||k==='arrowup'||k===' ')jbuf=.13;auInit();
  if(k==='escape'){
    if(setOpen)closeSet();
    else if(state==='title'){if(tsub==='slots')tsub='main';else setOpen=true}
    else if(invOpen)invOpen=false;
    else if(!P.dead){setOpen=true;setScroll=0;useDown=false}
    return;
  }
  if(setOpen)return;
  if(state==='title'){
    if(k==='enter'&&tsub==='main')tsub='slots';
    else if(tsub==='slots'&&k>='1'&&k<='3'){const i=+k-1;if(slotMeta[i]){if(!load(i))newGame(i)}else newGame(i)}
    return;
  }
  if(k==='m')toggleMute();
  if(P.dead)return;
  if(k==='e'||k==='tab'){invOpen=!invOpen;invTab=0;craftScroll=0;useDown=false}
  else if(k==='r')interact();
  else if(k==='h')quickHeal();
  else if(k>='1'&&k<='8')sel=+k-1;
});
window.addEventListener('keyup',e=>{keys[keyOf(e)]=false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;useDown=false;rightDown=false;jumpBtn=false;atkBtn=false;jx=0;jy=0;joyId=-1});
window.addEventListener('resize',doResize);
window.addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

function frame(ts){
  requestAnimationFrame(frame);
  let dt=(ts-lastT)/1000;lastT=ts;
  if(!(dt>0))dt=.016;if(dt>.1)dt=.1;
  rn=0;
  if(state==='play'){
    if(setOpen||invOpen){scanNear()}
    else{const n=dt>.034?2:1;for(let i=0;i<n;i++)update(dt/n)}
  }else gt+=dt*1.2;
  musT-=dt;
  if(musT<=0){musT=.5;AU.mode=musicMode()}
  ctx.setTransform(1,0,0,1,0,0);
  if(shake>0&&state==='play'&&CFG.shake){ctx.translate((Math.random()-.5)*shake*20*DPR,(Math.random()-.5)*shake*20*DPR)}
  if(state==='title'){drawTitle(dt)}
  else{
    drawSky();drawWorld();drawNpc();
    for(const m of mons)drawMon(m);
    drawPlayer();
    drawLight();
    drawProjs();drawFx();drawBubbles();
    ctx.setTransform(1,0,0,1,0,0);
    drawVignette(.8+(P.hp<P.max*.3&&!P.dead?.2+Math.sin(gt*8)*.15:0));
    if(P.hp<P.max*.3&&!P.dead){ctx.fillStyle='rgba(180,0,20,'+(.08+Math.sin(gt*8)*.04).toFixed(3)+')';ctx.fillRect(0,0,W,H)}
    drawHUD();
    if(invOpen&&!P.dead)drawInv();
    if(P.dead)drawDead();
  }
  ctx.setTransform(1,0,0,1,0,0);
  if(setOpen)drawSettings();
  if(fadeA>0){ctx.fillStyle='rgba(8,6,20,'+fadeA.toFixed(3)+')';ctx.fillRect(0,0,W,H);fadeA=Math.max(0,fadeA-dt*2.2)}
}
try{document.fonts.load('700 16px "Noto Sans KR"');document.fonts.load('500 16px "Noto Sans KR"');document.fonts.load('900 16px "Black Han Sans"')}catch(e){}
resize();genTextures();genWorld((Math.random()*1e9)|0);checkSave();gt=CYC*.2;
requestAnimationFrame(frame);
})();
</script>
